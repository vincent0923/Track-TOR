<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>年轮 Rings</title>
<meta name="theme-color" content="#F1ECE2">
<link rel="manifest" href="../manifest.json">
<style>
/* 年轮 Rings: one screen. A tree's cross-section grows one ring a day: thick when you trained hard, coloured by what
   you did, hair-thin when you rested. Set like a specimen plate: paper, ink, a measured scale, small serif captions. */
:root{--paper:#F1ECE2;--ink:#231C15;--soft:#6F6357;--rule:#CFC5B5;--s:#A4452C;--e:#1F6E7E;--m:#6E8B3D;--p:#C68A1E;--o:#6B5B4D;
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);overscroll-behavior:none}
body{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 18px calc(14px + env(safe-area-inset-bottom))}
::selection{background:#D9C9A8}
header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--ink);padding-bottom:8px}
h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.12em}
h1 small{font:400 12px var(--mono);letter-spacing:.08em;color:var(--soft);margin-left:8px}
.plate{font:12px var(--mono);color:var(--soft);letter-spacing:.06em;text-align:right}
main{display:grid;align-content:center;justify-items:center;gap:10px;padding:10px 0}
#disc{width:min(100%,62dvh);aspect-ratio:1;touch-action:none;display:block;cursor:crosshair}
.cap{width:100%;min-height:64px;text-align:center}
.cap b{display:block;font-size:19px;font-weight:700;letter-spacing:.04em}
.cap span{display:block;margin-top:3px;font-size:14px;color:var(--soft);line-height:1.5}
.cap .undo{margin-top:6px;border:0;border-bottom:1px solid var(--soft);background:none;color:var(--soft);font:13px var(--serif);padding:0;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:12px;color:var(--soft)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
footer{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;border-top:1px solid var(--rule);padding-top:12px}
.hold{position:relative;overflow:hidden;height:58px;border:1.5px solid var(--ink);background:none;color:var(--ink);border-radius:2px;font:700 17px var(--serif);letter-spacing:.08em;cursor:pointer;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;--p:0}
.hold::before{content:"";position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(var(--p,0));transition:transform .12s linear}
.hold span{position:relative;mix-blend-mode:difference;color:#F1ECE2}
.hold.down{transform:translateY(1px)}
.ib{width:46px;height:58px;border:1px solid var(--rule);background:none;border-radius:2px;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.ib svg{width:20px;height:20px}
button:focus-visible{outline:2px solid var(--e);outline-offset:2px}
/* the sheet that asks what today's ring was */
.sheet{position:fixed;inset:0;z-index:5;display:grid;align-items:end;background:rgba(35,28,21,.28);animation:fade .18s ease-out}
.sheet[hidden]{display:none}
.sheet>div{background:var(--paper);border-top:1px solid var(--ink);padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-width:560px;width:100%;margin:0 auto;animation:rise .28s cubic-bezier(.2,.9,.3,1)}
.sheet h2{margin:0 0 2px;font-size:20px;letter-spacing:.06em}
.sheet p{margin:0 0 12px;font-size:13px;color:var(--soft)}
.kinds{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.kinds button{border:1px solid var(--rule);background:none;border-radius:2px;padding:12px 0 9px;font:14px var(--serif);color:var(--ink);cursor:pointer;display:grid;justify-items:center;gap:7px}
.kinds button i{width:22px;height:22px;border-radius:50%}
.kinds button:active{background:#E7DFD0}
.sheet input{width:100%;margin-top:12px;border:0;border-bottom:1px solid var(--ink);background:none;font:16px var(--serif);color:var(--ink);padding:8px 0;border-radius:0}
.sheet input::placeholder{color:#9A8F82}
.sheet input:focus{outline:none;border-bottom-width:2px}
.about p{font-size:15px;line-height:1.75;color:var(--ink);margin:0 0 10px}
.about .x{margin-top:6px;border:1.5px solid var(--ink);background:none;height:46px;width:100%;font:700 15px var(--serif);letter-spacing:.08em;color:var(--ink);border-radius:2px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:14px;padding:9px 14px;border-radius:2px;z-index:6;white-space:nowrap}
.toast[hidden]{display:none}
@keyframes fade{from{opacity:0}}@keyframes rise{from{transform:translateY(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet>div{animation:none}.hold::before{transition:none}}
</style></head><body>
<header><h1><span data-t="title">年轮</span><small id="sub">RINGS</small></h1><div class="plate" id="plate"></div></header>
<main>
  <canvas id="disc" role="img" aria-label="年轮"></canvas>
  <div class="cap" id="cap" aria-live="polite"></div>
  <div class="legend" id="legend"></div>
</main>
<footer>
  <button class="hold" id="hold" type="button"><span id="holdT"></span></button>
  <button class="ib" id="share" type="button" aria-label="存成图片 / Save as picture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 7.5 12 3l4.500 4.500M5 14v5.500h14V14"/></svg></button>
  <button class="ib" id="aboutB" type="button" aria-label="这是什么 / About"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.500v.1"/></svg></button>
</footer>
<div class="sheet" id="kindS" hidden><div>
  <h2 id="kindH"></h2><p id="kindP"></p>
  <div class="kinds" id="kinds"></div>
  <input id="note" type="text" maxlength="60" enterkeyhint="done" autocomplete="off">
</div></div>
<div class="sheet about" id="aboutS" hidden><div>
  <h2 data-t="aboutH"></h2><div id="aboutT" style="margin-top:10px"></div>
  <button class="x" id="aboutX" type="button"></button>
</div></div>
<div class="toast" id="toast" hidden></div>
<script>
"use strict";
/* ---------- words ---------- */
let LANG="zh";try{LANG=localStorage.getItem("tracktor-lang")||(/^zh/i.test(navigator.language)?"zh":"en")}catch(e){}
const T=(zh,en)=>LANG==="en"?en:zh;
const KINDS=[["s","力量","Strength","--s"],["e","耐力","Endurance","--e"],["m","舒展","Mobility","--m"],["p","玩","Play","--p"],["o","别的","Other","--o"]];
const LEVELS=[["动了动","Moved a bit"],["认真练了","A real session"],["出汗了","Worked up a sweat"],["很拼","Went hard"],["掏空了","Emptied the tank"]];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const KCOL=Object.fromEntries(KINDS.map(k=>[k[0],css(k[3])]));
const kname=k=>{const r=KINDS.find(x=>x[0]===k)||KINDS[4];return T(r[1],r[2])};
/* ---------- days ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const [y,m,d]=s.split("-").map(Number);const t=new Date(y,m-1,d);t.setDate(t.getDate()+n);return ymd(t)};
const dnum=s=>{const p=s.split("-");return Date.UTC(+p[0],+p[1]-1,+p[2])/864e5};
const nice=s=>{const p=s.split("-");return T(p[0]+"."+(+p[1])+"."+(+p[2]),new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("en",{day:"numeric",month:"short",year:"numeric"}))};
/* ---------- marks ----------
   Own marks live in tracktor-rings: [{d, k, e (1-5), n, t}]. Marks are also grown, read-only, from what 推拉机 already
   holds on this phone: finished sessions and extra practice (strength) and the watch's workout calories (endurance,
   or mobility for the low-intensity part). Nothing is written back to 推拉机's data. */
const K="tracktor-rings";
let own=[];try{own=JSON.parse(localStorage.getItem(K)||"[]")||[]}catch(e){own=[]}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(own))}catch(e){}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function grown(){const out=[];let j=null;try{j=JSON.parse(localStorage.getItem("tracktor-data")||"null")}catch(e){}if(!j)return out;
  Object.entries(j.sessions||{}).forEach(([sid,s])=>{if(!s||!s.done||!s.date)return;let n=0;
    Object.values(s.sets||{}).forEach(a=>a.forEach(x=>{if(x.d)n++}));(s.xs||[]).forEach(it=>it.sets.forEach(x=>{if(x.d)n++}));
    const m=/^(push|pull)-(\d+)$/.exec(sid);out.push({d:s.date,k:"s",e:clamp(Math.ceil(n/6),2,5),n:m?T((m[1]==="push"?"推练":"拉练")+" D"+(+m[2]),(m[1]==="push"?"Push":"Pull")+" D"+(+m[2])):"",src:1})});
  Object.entries(j.dayx||{}).forEach(([d,x])=>{let n=0;((x&&x.xs)||[]).forEach(it=>it.sets.forEach(y=>{if(y.d)n++}));if(n)out.push({d,k:"s",e:clamp(Math.ceil(n/3),1,3),n:T("加练","Extra practice"),src:1})});
  Object.values(j.metrics||{}).forEach(m=>{if(!m||!m.date)return;const ex=+m.ex||0,low=Math.min(+m.exL||0,ex),hard=ex-low;
    if(hard>=60)out.push({d:m.date,k:"e",e:clamp(Math.round(hard/170),1,5),n:Math.round(hard)+" kcal",src:1});
    if(low>=60)out.push({d:m.date,k:"m",e:clamp(Math.round(low/140),1,3),n:Math.round(low)+" kcal",src:1})});
  return out}
let MARKS=[],DAYS=[],BY={};
function build(preview){MARKS=grown().concat(own);if(preview)MARKS=MARKS.concat([preview]);
  BY={};MARKS.forEach(m=>{(BY[m.d]=BY[m.d]||[]).push(m)});
  const td=today(),first=Object.keys(BY).sort()[0]||td;DAYS=[];
  for(let d=first;d<=td;d=addDays(d,1)){const ms=BY[d]||[],E=Math.min(6.500,ms.reduce((a,m)=>a+m.e,0));DAYS.push({d,ms,E,u:ms.length?1.600+0.800*E:1})}}
/* ---------- the disc ---------- */
const cv=document.getElementById("disc"),cx=cv.getContext("2d");let W=0,G=null,sel=-1;
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed||1;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mix(a,b,t){const p=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)),x=p(a),y=p(b);return "rgb("+x.map((v,i)=>Math.round(v+(y[i]-v)*t)).join(",")+")"}
/* every tree has its own slow wobble (seeded by its first day), shared by all its rings so they stay parallel */
function shape(){const r=rng(hash(DAYS[0].d)),h=[];for(let k=2;k<=7;k++)h.push([k,(r()-.5)*1.600/k,r()*6.283]);return t=>{let s=0;for(const [k,a,p] of h)s+=a*Math.sin(k*t+p);return 1+.045*s}}
function layout(size){const R=size/2,bark=Math.max(5,R*.035),pith=Math.max(3,R*.02),room=R*.86-bark-pith;
  const units=DAYS.reduce((a,d)=>a+d.u,0),px=Math.min(room/units,R*clamp(.9/(DAYS.length+4),.03,.16));let r=pith;const edges=[pith];DAYS.forEach(d=>{r+=d.u*px;edges.push(r)});
  return {R,bark,pith,edges,outer:r,wob:shape()}}
function ringPath(c,g,r,a0,a1,jit){const n=Math.max(48,Math.round(r*.9));c.beginPath();for(let i=0;i<=n;i++){const t=a0+(a1-a0)*i/n,rr=r*g.wob(t)+(jit?jit(t):0);c[i?"lineTo":"moveTo"](g.R+rr*Math.cos(t),g.R+rr*Math.sin(t))}}
function draw(c,size,opt){opt=opt||{};const g=layout(size),wood=["#E9D9BC","#E3D1B0"],TAU=Math.PI*2;
  if(opt.bg){c.fillStyle=opt.bg;c.fillRect(0,0,size,size)}else c.clearRect(0,0,size,size);
  /* bark: a rough dark edge */
  const br=rng(hash(DAYS[0].d)+7),bj=[];const amp=Math.min(g.bark*.5,g.outer*.05);for(let k=9;k<=31;k+=2)bj.push([k,(br()-.5)*amp,br()*6.283]);
  ringPath(c,g,g.outer+g.bark,0,TAU,t=>bj.reduce((s,[k,a,p])=>s+a*Math.sin(k*t+p),0));c.fillStyle="#3B2B1F";c.fill();
  /* rings, outermost first; each disc covers the inside of the one before */
  for(let i=DAYS.length-1;i>=0;i--){const d=DAYS[i],r=g.edges[i+1];
    if(!d.ms.length){ringPath(c,g,r,0,TAU);c.fillStyle=wood[i%2];c.fill()}
    else{let a=(hash(d.d)%6283)/1000;const tot=d.ms.reduce((s,m)=>s+m.e,0);
      d.ms.forEach(m=>{const span=TAU*m.e/tot;ringPath(c,g,r,a,a+span);c.lineTo(g.R,g.R);c.closePath();c.fillStyle=mix(KCOL[m.k]||KCOL.o,"#E9D9BC",clamp(.42-.07*d.E,.05,.4));c.fill();a+=span})}
    ringPath(c,g,r,0,TAU);c.strokeStyle="rgba(59,43,31,"+(d.ms.length?.5:.2)+")";c.lineWidth=d.ms.length?.9:.5;c.stroke()}
  c.beginPath();c.arc(g.R,g.R,g.pith,0,TAU);c.fillStyle="#5A4030";c.fill();
  /* rays: faint light lines from the pith, as in real wood */
  const rr=rng(hash(DAYS[0].d)+3);c.strokeStyle="rgba(255,248,232,.13)";c.lineWidth=.7;
  for(let i=0;i<46;i++){const t=rr()*TAU,r0=g.pith+rr()*g.outer*.5,r1=r0+rr()*g.outer*.5;c.beginPath();c.moveTo(g.R+r0*Math.cos(t),g.R+r0*Math.sin(t));c.lineTo(g.R+Math.min(r1,g.outer)*g.wob(t)*Math.cos(t),g.R+Math.min(r1,g.outer)*g.wob(t)*Math.sin(t));c.stroke()}
  /* today, not marked yet: the growing edge, drawn as a dashed line waiting to be filled */
  const last=DAYS[DAYS.length-1];if(!last.ms.length&&!opt.still){c.save();c.setLineDash([3,4]);ringPath(c,g,g.edges[DAYS.length],0,TAU);c.strokeStyle="#231C15";c.lineWidth=1.200;c.stroke();c.restore()}
  /* the scale: a measured line to the right, a tick where each month began */
  c.strokeStyle="#231C15";c.fillStyle="#231C15";c.lineWidth=.8;c.font=Math.round(size*.027)+"px ui-monospace,Menlo,monospace";c.textBaseline="middle";
  const x1=g.R+(g.outer+g.bark)*g.wob(0)+size*.02;c.beginPath();c.moveTo(g.R,g.R);c.lineTo(x1,g.R);c.globalAlpha=.55;c.stroke();c.globalAlpha=1;
  let lastX=-99;DAYS.forEach((d,i)=>{if(i&&d.d.slice(8)!=="01")return;const x=g.R+g.edges[i]*g.wob(0);c.beginPath();c.moveTo(x,g.R-4);c.lineTo(x,g.R+4);c.stroke();
    if(x-lastX>size*.07){c.save();c.translate(x+2,g.R+8);c.rotate(Math.PI/2);c.fillText(T((+d.d.slice(5,7))+"月",new Date(2000,+d.d.slice(5,7)-1,1).toLocaleString("en",{month:"short"})),0,0);c.restore();lastX=x}});
  /* the chosen ring */
  if(opt.sel>=0&&opt.sel<DAYS.length){c.lineWidth=1.800;c.strokeStyle="#231C15";ringPath(c,g,g.edges[opt.sel+1],0,TAU);c.stroke();if(opt.sel>0||g.edges[0]>4){ringPath(c,g,g.edges[opt.sel],0,TAU);c.stroke()}}
  return g}
function paint(){const dpr=Math.min(3,window.devicePixelRatio||1),w=cv.clientWidth;if(!w)return;if(cv.width!==Math.round(w*dpr)){cv.width=cv.height=Math.round(w*dpr)}
  W=w;cx.setTransform(dpr,0,0,dpr,0,0);G=draw(cx,w,{sel})}
/* ---------- captions ---------- */
const $=id=>document.getElementById(id);
function caption(){const el=$("cap"),td=today();
  if(sel>=0&&DAYS[sel]){const d=DAYS[sel];
    if(!d.ms.length){el.innerHTML="<b>"+nice(d.d)+"</b><span>"+(d.d===td?T("今天这一圈还没长。","Today's ring hasn't grown yet."):T("休息。休息也是一圈。","Rest. Rest is a ring too."))+"</span>";return}
    const lines=d.ms.map(m=>kname(m.k)+" · "+T(LEVELS[m.e-1][0],LEVELS[m.e-1][1])+(m.n?"（"+esc(m.n)+"）":"")).join("<br>");
    const mine=d.d===td&&own.some(m=>m.d===td);
    el.innerHTML="<b>"+nice(d.d)+"</b><span>"+lines+"</span>"+(mine?'<button class="undo" id="undo" type="button">'+T("撤销最后一笔","Undo the last mark")+"</button>":"");return}
  const act=DAYS.filter(d=>d.ms.length).length;
  el.innerHTML=act?"<b>"+T(DAYS.length+" 圈",DAYS.length+(DAYS.length===1?" ring":" rings"))+"</b><span>"+T("其中 "+act+" 圈是练出来的，"+(DAYS.length-act)+" 圈是歇出来的。<br>手指划过年轮，看每一天。",act+" grown by training, "+(DAYS.length-act)+" by rest.<br>Slide a finger across the rings to read each day.")+"</span>"
    :"<b>"+T("一棵还没长的树","A tree that hasn't grown yet")+"</b><span>"+T("今天动一动，然后按住下面那条，留下第一圈。","Move today, then hold the bar below to leave the first ring.")+"</span>";}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function chrome(){document.documentElement.lang=LANG==="en"?"en":"zh-CN";
  document.querySelectorAll("[data-t=title]").forEach(e=>e.textContent=T("年轮","Rings"));$("sub").textContent=T("RINGS","年轮");
  $("plate").innerHTML=T("第 "+DAYS.length+" 圈","Ring "+DAYS.length)+"<br>"+nice(today());
  $("holdT").textContent=T("按住，留下今天这一圈","Hold to leave today's ring");
  $("legend").innerHTML=KINDS.map(k=>'<span><i style="background:'+KCOL[k[0]]+'"></i>'+T(k[1],k[2])+"</span>").join("");
  $("note").placeholder=T("想写就写一句：骑了 40 公里 / 引体 5×6","A line if you like: rode 40 km / pull-ups 5×6");
  $("aboutX").textContent=T("知道了","Got it");
  document.querySelector("[data-t=aboutH]").textContent=T("身体记得","The body keeps count");
  $("aboutT").innerHTML=[T("这不是记账本。这里只有一棵树的横截面：每天长一圈。","This isn't a ledger. It is one tree's cross-section: a ring a day."),
    T("练得越狠，那一圈越厚；练的是什么，那一圈就是什么颜色。骑车、力量、瑜伽、打球，都算。","The harder the day, the thicker its ring; what you did gives it its colour. Riding, lifting, yoga, a game: all count."),
    T("休息的日子也长一圈，只是很薄。没有连续打卡，也就没有断签。","Rest days grow a ring too, a thin one. No streaks, so nothing to break."),
    T("按住下面那条：按得越久，今天这一圈越厚。松手，点一下练的是什么，就好了。","Hold the bar below: the longer you hold, the thicker today's ring. Let go, tap what it was, done.")
    +(grown().length?T("<br>这台手机上推拉机已有的训练和手表运动记录，已经替你长进去了。","<br>The sessions and watch workouts already in track-TOR on this phone have been grown in for you."):"")].map(p=>"<p>"+p+"</p>").join("")}
function refresh(){build();paint();caption();chrome()}
let toastT=0;function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,2200)}
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
/* a soft knock on wood, synthesised */
let AC=null;function knock(level){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type="sine";o.frequency.setValueAtTime(210+level*38,t);o.frequency.exponentialRampToValueAtTime(90,t+.09);g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.13);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.14)}catch(e){}}
/* ---------- reading the rings: slide a finger across them ---------- */
function pick(ev){if(!G)return;const b=cv.getBoundingClientRect(),x=ev.clientX-b.left-G.R,y=ev.clientY-b.top-G.R,t=Math.atan2(y,x),r=Math.hypot(x,y)/G.wob(t);
  let i=-1;for(let k=0;k<DAYS.length;k++)if(r<=G.edges[k+1]){i=k;break}
  if(i<0)i=r<=G.outer+G.bark*2?DAYS.length-1:-1;if(i!==sel){sel=i;if(i>=0)buzz(3);paint();caption()}}
let reading=false;
cv.addEventListener("pointerdown",e=>{reading=true;try{cv.setPointerCapture(e.pointerId)}catch(x){}pick(e)});
cv.addEventListener("pointermove",e=>{if(reading||e.pointerType==="mouse")pick(e)});
["pointerup","pointercancel"].forEach(t=>cv.addEventListener(t,()=>{reading=false}));
cv.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse"){sel=-1;paint();caption()}});
$("cap").addEventListener("click",e=>{if(e.target.id!=="undo")return;const td=today();for(let i=own.length-1;i>=0;i--)if(own[i].d===td){own.splice(i,1);break}save();refresh();toast(T("撤销了","Undone"))});
/* ---------- leaving a ring: hold; the longer, the thicker ---------- */
const hold=$("hold");let t0=0,level=0,raf=0,pending=null;
function tick(){const el=performance.now()-t0,lv=clamp(1+Math.floor(el/620),1,5);hold.style.setProperty("--p",clamp(el/3100,0,1).toFixed(3));
  if(lv!==level){level=lv;buzz(8+lv*4);knock(lv);$("holdT").textContent=T(LEVELS[lv-1][0],LEVELS[lv-1][1]);build({d:today(),k:"o",e:lv,n:""});sel=DAYS.length-1;paint()}
  raf=requestAnimationFrame(tick)}
hold.addEventListener("pointerdown",e=>{e.preventDefault();try{hold.setPointerCapture(e.pointerId)}catch(x){}t0=performance.now();level=0;hold.classList.add("down");cancelAnimationFrame(raf);tick()});
function release(cancel){if(!t0)return;const el=performance.now()-t0;t0=0;cancelAnimationFrame(raf);hold.classList.remove("down");hold.style.setProperty("--p","0");chrome();
  if(cancel||el<260){sel=-1;refresh();if(!cancel)toast(T("按住久一点，圈就厚一点","Hold longer for a thicker ring"));return}
  pending={d:today(),e:level};$("kindH").textContent=T(LEVELS[level-1][0],LEVELS[level-1][1]);$("kindP").textContent=T("今天这一圈，练的是什么？","What was today's ring?");$("note").value="";$("kindS").hidden=false}
hold.addEventListener("pointerup",()=>release(false));hold.addEventListener("pointercancel",()=>release(true));
hold.addEventListener("contextmenu",e=>e.preventDefault());
hold.addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&!t0&&!e.repeat){e.preventDefault();t0=performance.now();level=0;tick()}});
hold.addEventListener("keyup",e=>{if(e.key===" "||e.key==="Enter")release(false)});
$("kinds").innerHTML=KINDS.map(k=>'<button type="button" data-k="'+k[0]+'"><i style="background:'+KCOL[k[0]]+'"></i><span></span></button>').join("");
function kindWords(){document.querySelectorAll("#kinds button").forEach(b=>{b.querySelector("span").textContent=kname(b.dataset.k)})}
$("kinds").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b||!pending)return;
  own.push({d:pending.d,k:b.dataset.k,e:pending.e,n:$("note").value.trim(),t:Date.now()});pending=null;save();$("kindS").hidden=true;sel=-1;refresh();sel=DAYS.length-1;paint();caption();knock(5);buzz(30)});
$("kindS").addEventListener("click",e=>{if(e.target===$("kindS")){pending=null;$("kindS").hidden=true;sel=-1;refresh()}});
$("aboutB").addEventListener("click",()=>{$("aboutS").hidden=false});$("aboutX").addEventListener("click",()=>{$("aboutS").hidden=true});
$("aboutS").addEventListener("click",e=>{if(e.target===$("aboutS"))$("aboutS").hidden=true});
/* ---------- a picture to keep or send: the disc as a specimen plate ---------- */
async function plate(){const S=1080,H=1350,c=document.createElement("canvas");c.width=S;c.height=H;const x=c.getContext("2d");
  x.fillStyle=css("--paper");x.fillRect(0,0,S,H);x.fillStyle="#231C15";x.textBaseline="alphabetic";
  const serif=getComputedStyle(document.body).fontFamily;x.font="700 76px "+serif;x.fillText(T("年轮","Rings"),70,140);
  x.font="26px ui-monospace,Menlo,monospace";x.textAlign="right";x.fillText(nice(DAYS[0].d)+" — "+nice(today()),S-70,104);x.fillText(T("第 "+DAYS.length+" 圈","Ring "+DAYS.length),S-70,140);x.textAlign="left";
  x.fillRect(70,166,S-140,2);
  x.save();x.translate(90,210);draw(x,900,{still:true,bg:css("--paper")});x.restore();
  const act=DAYS.filter(d=>d.ms.length).length;x.fillRect(70,1150,S-140,1);x.font="34px "+serif;
  x.fillText(T(act+" 圈是练出来的，"+(DAYS.length-act)+" 圈是歇出来的。",act+" rings grown by training, "+(DAYS.length-act)+" by rest."),70,1210);
  let lx=70;x.font="24px "+serif;KINDS.forEach(k=>{x.fillStyle=KCOL[k[0]];x.beginPath();x.arc(lx+10,1262,10,0,7);x.fill();x.fillStyle="#6F6357";const w=T(k[1],k[2]);x.fillText(w,lx+28,1271);lx+=28+x.measureText(w).width+34});
  return new Promise(r=>c.toBlob(r,"image/png"))}
$("share").addEventListener("click",async()=>{const blob=await plate(),name=T("年轮","rings")+"-"+today()+".png",file=new File([blob],name,{type:"image/png"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:T("我的年轮","My rings")});return}}catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast(T("图片存好了","Picture saved"))});
/* ---------- start ---------- */
addEventListener("resize",paint);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
refresh();kindWords();
let seen=false;try{seen=localStorage.getItem(K+"-seen")==="1"}catch(e){}if(!seen){$("aboutS").hidden=false;try{localStorage.setItem(K+"-seen","1")}catch(e){}}
if("serviceWorker" in navigator)addEventListener("load",()=>{navigator.serviceWorker.register("../sw.js").catch(()=>{})});
</script></body></html>
